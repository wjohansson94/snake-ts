<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
  </head>
  <body>
    <main>
      <h1>Snake</h1>
      <p class="score" aria-live="polite">Score: <span id="score">0</span></p>
      <p class="best">Best: <span id="best">0</span></p>
      <label class="difficulty">
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <canvas id="game" role="img" aria-label="Snake game board"></canvas>
      <p id="status" class="visually-hidden" role="status"></p>
      <p class="instructions">
        Steer with the arrow keys or WASD. Press P or Esc to pause, Enter or Space to restart.
        On a touch screen, swipe on the board to steer and tap it to pause or restart.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
